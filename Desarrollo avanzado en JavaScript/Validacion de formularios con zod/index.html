<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación con Zod - Wacky Pomo</title>
  <!-- Enlace a la hoja de estilos -->
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/zod@3.21.4/lib/index.umd.min.js"></script>
</head>
<body>

  <div class="page-container">
    <!-- SECCIÓN DEL FORMULARIO -->
    <main class="form-section">
      <h1>Registro de usuario</h1>
      <form id="registerForm">
        <div class="input-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" placeholder="Tu nombre" required />
        </div>

        <div class="input-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="Tu correo" required />
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Contraseña" required />
        </div>

        <button type="submit">Registrar →</button>
      </form>
      <p id="errors"></p>
    </main>

    <aside class="graphics-section">
      <div class="wacky-shapes">
        <div class="shape circle"></div>
        <div class="shape triangle"></div>
        <div class="shape zigzag"></div>
        <div class="shape square-blob"></div>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
